spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  # Testcontainers will override these values automatically
  datasource:
    url: jdbc:postgresql://localhost:5432/giftservice_dev
    username: giftservice
    password: giftservice
    driver-class-name: org.postgresql.Driver

  # Enable Flyway for database migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    com.giftservice: DEBUG
    org.testcontainers: INFO
    org.springframework.web: DEBUG
    
# Testcontainers configuration
testcontainers:
  enabled: true
  reuse:
    enable: true